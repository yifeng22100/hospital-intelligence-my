name: Auto-Update Site Content

# Runs Claude Code on a schedule to re-verify time-sensitive facts (insurer
# hotlines/panels, procedure costs, vaccine/health guidance, and a rotating
# slice of the hospital directory) and refresh anything that's changed.
#
# Requires a repo secret named ANTHROPIC_API_KEY (Settings → Secrets and
# variables → Actions → New repository secret). Without it this workflow
# will fail at the "Run Claude Code" step — everything else is inert until
# that key is added.
#
# Policy: changes are made on a dated branch, then the site is built.
# Only if the build succeeds are they pushed directly to main (which
# triggers deploy.yml, so the refresh goes live in the same run). A
# failed build is never merged — instead it's pushed to the dated branch
# for manual review and a GitHub issue is opened. The build is the only
# gate; there is no human review step before a successful run reaches
# the live site.

on:
  schedule:
    - cron: "0 3 1 * *" # 1st of each month, 03:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Note: no id-token permission — this workflow authenticates to the
  # Anthropic API with a plain API key (ANTHROPIC_API_KEY), not via
  # GitHub's OIDC token exchange, so it isn't needed here.

concurrency:
  group: auto-update-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create dated branch
        id: branch
        run: |
          BRANCH="auto-update/$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to research and refresh content
        # The prompt lives in scripts/auto-update-prompt.txt, shared with
        # scripts/auto-update.sh (the local equivalent of this workflow) —
        # edit that file, not this step, so the two never drift apart.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        id: claude
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --bare -p "$(cat scripts/auto-update-prompt.txt)" \
            --permission-mode acceptEdits \
            --allowedTools "WebSearch,WebFetch,Bash(npm run build)"

      - name: Build (gate for merge)
        # Only runs if Claude's own step actually succeeded — otherwise
        # this would build an unmodified checkout for no reason and mask
        # the real failure (e.g. an expired/exhausted API key) behind an
        # unrelated-looking "build passed, nothing to commit" no-op.
        if: steps.claude.outcome == 'success'
        id: build
        run: npm run build
        continue-on-error: true

      - name: Commit and push directly to main (build passed)
        # No PR/merge step here on purpose: this repo's default "Allow
        # GitHub Actions to create and approve pull requests" setting is
        # off (a common GitHub security default), which blocks `gh pr
        # create` from the built-in GITHUB_TOKEN with "GitHub Actions is
        # not permitted to create or approve pull requests" — separate
        # from, and not fixable via, this workflow's own `permissions:`
        # block. Since the agreed policy is "auto-merge with no human
        # review anyway," a PR-then-immediate-merge would be a detour to
        # the same place a direct push reaches directly — and pushing to
        # main also triggers deploy.yml, so the refreshed content goes
        # live in the same run. If you later enable that repo setting and
        # want a PR audit trail instead, swap this step back to
        # `gh pr create` + `gh pr merge`.
        if: steps.build.outcome == 'success'
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Automated content refresh — $(date -u +%Y-%m-%d)"
          git checkout main
          git merge --ff-only "${{ steps.branch.outputs.branch }}"

          # This can race against scripts/auto-update.sh running locally at
          # the same time — both authenticate independently (this step uses
          # ANTHROPIC_API_KEY, the local script uses subscription login) and
          # both push straight to main with no coordination between them.
          # If the local run pushes first, a plain `git push` here would be
          # rejected as non-fast-forward and this step would just fail
          # silently (nothing else was checking steps.commit.outcome).
          # Retry: re-fetch main and rebase our one commit onto whatever
          # landed first. If that's a real conflict rather than a clean
          # race, abort the rebase and let the step fail loudly instead of
          # guessing at a resolution — the failure step below then alerts
          # and preserves the commit on the dated branch.
          MAX_ATTEMPTS=5
          attempt=1
          until git push origin main; do
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::Push to main failed after $MAX_ATTEMPTS attempts — likely a repeated race with a concurrent run, or a real conflict."
              exit 1
            fi
            echo "Push rejected (attempt $attempt/$MAX_ATTEMPTS) — fetching and rebasing onto the new tip of main..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase onto origin/main hit a real conflict — not just a race."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
          git push origin --delete "${{ steps.branch.outputs.branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Report failure (Claude step, build, or push — nothing merged)
        # Catches all three failure modes so a bad run is never silent:
        # Claude's own step failing outright (e.g. an exhausted/invalid API
        # key — this is what actually happened the first two times this
        # ran), a build failure after Claude made changes, and a commit/push
        # failure (most likely a race with scripts/auto-update.sh running
        # locally at the same time — see the comment on the commit step).
        # Earlier versions of this workflow only checked claude/build, so a
        # push failure would just show a red X with nothing alerting anyone.
        if: steps.claude.outcome == 'failure' || steps.build.outcome == 'failure' || steps.commit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.claude.outcome }}" = "failure" ]; then
            gh issue create \
              --title "Auto-update content refresh: Claude Code step failed — $(date -u +%Y-%m-%d)" \
              --body "The scheduled content-refresh workflow's Claude Code step failed outright — most likely an Anthropic API key/billing issue (e.g. exhausted credit balance) rather than a code problem. Nothing was changed or merged. Check the failed run's logs for the exact error: $RUN_URL"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            git add -A
            git commit -m "Automated content refresh (BUILD FAILED, not merged) — $(date -u +%Y-%m-%d)" || true
            git push origin "${{ steps.branch.outputs.branch }}" || true
            gh issue create \
              --title "Auto-update content refresh failed to build — $(date -u +%Y-%m-%d)" \
              --body "The scheduled content-refresh workflow made changes that failed \`npm run build\`, so nothing was merged. The attempted changes are on branch \`${{ steps.branch.outputs.branch }}\` for manual review — see the failed run: $RUN_URL"
          else
            # The commit step got as far as building and committing locally
            # (checked out on main with the commit applied) but couldn't
            # push after retries. Push what we have to the dated branch
            # instead of losing it when the runner is torn down.
            git push origin HEAD:"${{ steps.branch.outputs.branch }}" || true
            gh issue create \
              --title "Auto-update content refresh: push to main failed — $(date -u +%Y-%m-%d)" \
              --body "The scheduled content-refresh workflow built and committed changes successfully, but repeatedly failed to push to \`main\` after retrying — most likely a race with \`scripts/auto-update.sh\` running locally at the same time (it pushed first), or a real merge conflict. The committed changes have been pushed to branch \`${{ steps.branch.outputs.branch }}\` for manual review/merge — see the failed run: $RUN_URL"
          fi
