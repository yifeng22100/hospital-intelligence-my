name: Auto-Update Site Content

# Runs Claude Code on a schedule to re-verify time-sensitive facts (insurer
# hotlines/panels, procedure costs, vaccine/health guidance, and a rotating
# slice of the hospital directory) and refresh anything that's changed.
#
# Requires a repo secret named ANTHROPIC_API_KEY (Settings → Secrets and
# variables → Actions → New repository secret). Without it this workflow
# will fail at the "Run Claude Code" step — everything else is inert until
# that key is added.
#
# Policy: changes are committed to a dated branch, the site is built, and
# the PR is auto-merged ONLY if the build succeeds. A failed build blocks
# the merge and opens an issue instead, so a bad edit can never reach the
# live site unreviewed by a human — the build is the only gate.

on:
  schedule:
    - cron: "0 3 1 * *" # 1st of each month, 03:00 UTC
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-update-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Create dated branch
        id: branch
        run: |
          BRANCH="auto-update/$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code to research and refresh content
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Read,Edit,Write,Grep,Glob,Bash(npm run build),WebSearch,WebFetch"
          prompt: |
            You are doing a periodic maintenance pass on a Malaysian healthcare
            information site (React SPA, no backend, static data in src/data/).
            Your job is to re-verify facts that are likely to have drifted since
            they were last checked, and correct anything that's actually wrong —
            not to rewrite content that's still accurate.

            Do NOT run git commands, do NOT commit, and do NOT open a PR — the
            workflow that invoked you handles all of that after you're done.
            Only edit files.

            Priority order (stop early if you run low on budget — do the top
            categories properly rather than skimming everything shallowly):

            1. Insurance data — src/data/insurance-panels.js and the
               INSURER_HOTLINES constant in src/pages/Tools.jsx. Verify GL
               hotlines, TPA arrangements, and any panel hospital changes for
               all 13 insurers against current insurer announcements.
            2. Cost reference — src/data/cost-reference.js. Spot-check a sample
               of procedures across different categories against current
               published Malaysian private hospital pricing. Only change figures
               you've actually verified have moved — don't apply blanket
               inflation math. Update the `lastUpdated` field and disclaimer
               to reflect today's date once you're done.
            3. Vaccine & health guidance — the Vaccination Guide topic in
               src/pages/Knowledge.jsx (COVID/flu formulations, eligibility,
               dosing) and the Drug Interaction Checker's entries. These are
               higher-stakes if wrong — only change something if you can
               confirm it from a credible source (MOH, WHO, a named hospital,
               a reputable news outlet).
            4. Hospital directory — src/data/hospitals/*.js. Do not attempt to
               re-verify all 295 hospitals in one run. Pick roughly 15-20
               hospitals you have not touched in a prior run (look at git log
               for src/data/hospitals/ to see what's been recently touched, and
               favour ones that haven't) and verify bed counts, accreditations,
               specialties, and contact details against official sources.
            5. Everything else — the Intelligence Hub changelog, regulatory
               notes (BNM, MOH), and any other page — if you have budget left
               after 1-4, do a lighter pass here.

            For every fact-heavy section that already has a `<LastVerified
            date="..." />` badge (see src/components/LastVerified.jsx), update
            its date to today if you touched that section, or leave it alone if
            you didn't. Follow the same standard used throughout this codebase:
            cite what you found, don't fabricate precision, and prefer widening
            a range or adding a caveat over asserting a number you can't back up.

            When you're done, run `npm run build` yourself as a sanity check
            before finishing, so obvious syntax errors don't reach the outer
            build gate. Leave a brief written summary of what you changed and
            why in your final message (the workflow will use it as context, not
            as a commit message).

      - name: Install dependencies and build
        id: build
        run: |
          npm ci
          npm run build
        continue-on-error: true

      - name: Commit, push, and open PR (only if something changed)
        if: steps.build.outcome == 'success'
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Automated content refresh — $(date -u +%Y-%m-%d)"
          git push origin "${{ steps.branch.outputs.branch }}"
          PR_URL=$(gh pr create \
            --title "Automated content refresh — $(date -u +%Y-%m-%d)" \
            --body "Scheduled fact-check pass by Claude Code. Build passed before this PR was opened, so it will auto-merge — review the diff afterward if you want to spot-check what changed." \
            --base main \
            --head "${{ steps.branch.outputs.branch }}")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Auto-merge (build passed)
        if: steps.build.outcome == 'success' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.commit.outputs.pr_url }}" --squash --delete-branch

      - name: Report build failure (do not merge)
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          git commit -m "Automated content refresh (BUILD FAILED, not merged) — $(date -u +%Y-%m-%d)" || true
          git push origin "${{ steps.branch.outputs.branch }}" || true
          gh issue create \
            --title "Auto-update content refresh failed to build — $(date -u +%Y-%m-%d)" \
            --body "The scheduled content-refresh workflow made changes that failed \`npm run build\`, so nothing was merged. The attempted changes are on branch \`${{ steps.branch.outputs.branch }}\` for manual review — see the failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
